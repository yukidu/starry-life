name: Life Starry - Test and Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never allow overlapping production releases; first release remains gated by
# PRODUCTION_DEPLOY_ENABLED to avoid accidentally replacing the live Worker.
concurrency:
  group: life-starry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify all tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install packages
        run: npm ci
      - name: Check numerology and build site
        run: npm run check
      - name: Check worker build exactly matches release rule
        run: |
          node scripts/generate-worker.mjs
          node scripts/verify-release.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser tests
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify actual phone / tablet / desktop interactions
        run: |
          node scripts/make-offline-preview.mjs
          python tests/browser_smoke.py
          python tests/theme_smoke.py

  deploy:
    name: Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://life.starry.phd/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build exact current Worker format
        run: |
          npm run build
          node scripts/generate-worker.mjs
          node scripts/verify-release.mjs
      - name: Publish to the existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.toml
      - name: Verify formal site after deployment
        run: node scripts/verify-production.mjs
      - name: Display release reference
        run: |
          echo "## life.starry.phd production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://life.starry.phd/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker checksum: $(sha256sum .deploy/worker.mjs | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
